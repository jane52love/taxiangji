<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5d4a" />
    <title>她乡记</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="plain-icon menu-button" id="openNav" aria-label="打开菜单">☰</button>
        <div>
          <p class="brand-mark">数字木兰 - 她乡记</p>
          <h1>跟我说说，你今天想拍什么</h1>
        </div>
        <button class="save-btn" id="saveMaterial">保存</button>
      </header>

      <main class="screen active" id="homeScreen">
        <section class="skill-rail-wrap" id="skillChooser">
          <div>
            <span class="panel-label">场景入口</span>
            <h2>先选一个想做的事</h2>
          </div>
          <section class="skill-grid" id="skillGrid"></section>
        </section>

        <section class="loading-skill" id="loadingSkill" aria-live="polite">
          <span></span>
          <p>正在加载对应 Skill...</p>
        </section>

        <section class="messages" id="messages"></section>

        <section class="upload-preview" id="uploadPreview" aria-live="polite"></section>

        <section class="composer">
          <div class="input-bar">
            <label class="icon-btn file-btn" aria-label="上传图片">
              +
              <input id="imageInput" type="file" accept="image/*" multiple />
            </label>
            <button class="voice-display active" id="voiceDisplay" aria-label="语音输入">
              <span>按住说话</span>
            </button>
            <textarea id="textInput" rows="1" placeholder="尽管问..." aria-label="文字输入"></textarea>
            <button class="keyboard-icon" id="keyboardButton" aria-label="切换输入方式">
              <span></span><span></span><span></span>
            </button>
            <button class="send-icon" id="sendMessage" aria-label="发送">↑</button>
          </div>
          <p class="voice-hint" id="voiceStatus">内容由 AI 生成</p>
        </section>
      </main>

      <main class="screen" id="materialsScreen">
        <section class="section-heading top-section">
          <div>
            <p class="panel-label">项目文件夹</p>
            <h2>我的素材</h2>
          </div>
          <div class="inline-actions">
            <button class="secondary-btn returnChat">返回对话</button>
            <button class="secondary-btn" id="exportMaterials">导出</button>
          </div>
        </section>
        <section class="material-list" id="materialList"></section>
      </main>

      <main class="screen" id="knowledgeScreen">
        <section class="section-heading top-section">
          <div>
            <p class="panel-label">知识库-场景触发库.md</p>
            <h2>我的知识</h2>
          </div>
          <div class="inline-actions">
            <button class="secondary-btn returnChat">返回对话</button>
            <label class="secondary-btn import-btn">
              导入 MD
              <input id="knowledgeImport" type="file" accept=".md,text/markdown,text/plain" />
            </label>
          </div>
        </section>
        <section class="knowledge-tools">
          <input id="knowledgeSearch" type="search" placeholder="搜索：腌菜、茭白、孙女、石关乡..." />
          <button id="addKnowledge">新增主题</button>
          <button id="exportKnowledge">导出 MD</button>
        </section>
        <section class="knowledge-list" id="knowledgeList"></section>
      </main>

    </div>

    <dialog id="formatDialog">
      <form method="dialog" class="dialog-body">
        <h2>视频形式</h2>
        <label>发布平台<input id="platformInput" value="微信视频号" /></label>
        <label>视频时长<input id="durationInput" value="60-90 秒" /></label>
        <button class="primary-btn" value="confirm">确认</button>
      </form>
    </dialog>

    <script src="./app.js?v=20260830-bridge"></script>
  </body>
</html>
